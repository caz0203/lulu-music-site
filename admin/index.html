<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f7f8fa" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>LuluMusic 控制台</title>
<link rel="stylesheet" href="./app.css" />
</head>
<body>
<div id="login" class="login-wrap" hidden>
  <form class="login-card" id="loginForm">
    <div class="brand"><span class="dot"></span>LuluMusic 控制台</div>
    <p class="muted">登录后可管理公告、赞助、设备与反馈</p>
    <label>账号<input id="username" value="admin" autocomplete="username" /></label>
    <label>口令<input id="password" type="password" autocomplete="current-password" /></label>
    <button class="btn primary" type="submit">登录</button>
    <p class="hint" id="loginHint"></p>
  </form>
</div>

<div id="app" class="shell" hidden>
  <aside class="sidebar">
    <div class="brand"><span class="dot"></span>LuluMusic</div>
    <nav id="nav">
      <a data-view="dashboard" class="active">概览</a>
      <a data-view="announcements">公告</a>
      <a data-view="donors">赞助榜</a>
      <a data-view="devices">设备</a>
      <a data-view="feedback">反馈</a>
      <a data-view="sources">音源</a>
      <a data-view="release">发版</a>
      <a data-view="audit">审计</a>
      <a data-view="settings">设置</a>
    </nav>
    <div class="sidebar-foot">
      <span id="who" class="muted"></span>
      <button id="logout" class="link">退出</button>
    </div>
  </aside>

  <main class="content">
    <header class="topbar">
      <h1 id="title">概览</h1>
      <div class="topbar-actions"><button id="refresh" class="btn ghost">刷新</button></div>
    </header>
    <section id="view" class="view"></section>
  </main>
</div>

<div id="toast" class="toast" hidden></div>
<div id="modal" class="modal" hidden>
  <div class="modal-card">
    <header><h2 id="modalTitle">编辑</h2><button id="modalClose" class="link">关闭</button></header>
    <div id="modalBody"></div>
  </div>
</div>

<script type="module" src="./app.js"></script>
</body>
</html>
